name: Bug report
description: Report a reproducible diagnostic or CLI problem using synthetic data.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Do not paste a raw HAR, signed URL, token, customer file or private endpoint.
        Use synthetic data. For vulnerabilities or secret leakage, follow SECURITY.md
        and request a private reporting channel instead of describing it here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no raw captures, signed URLs, credentials or real customer data.
          required: true
  - type: input
    id: version
    attributes:
      label: Tool and runtime versions
      placeholder: upload-doctor 0.1.0; Node 24.x; operating system; Playwright version if applicable
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include the stable rule ID and whether inspection or browser capture was used.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Minimal steps or a small invented fixture; never a real HAR or URL.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional reviewed shared report
      description: Use the share command first, then review every field. Omit it if any details remain confidential.
